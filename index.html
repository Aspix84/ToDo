<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div class="todo">
        <div class="todo__box">
            <div class="todo__title">
                <h2>Job's List</h2>
            </div>
            <div class="todo__row">
                <input class="flatpickr flatpickr-input active datePickerFl" type="text" name="" id="datePicker" placeholder="Select Date" > 
                <select id="Location" class="LocationList"> 
                    <option value="" disabled selected>Select Location</option>
                    <option value="Administration">Administration</option>
                        <optgroup label="ground floor">
                            <option value="glavvrach">Plitkin</option>
                            <option value="nachmed">Mihail Ivanovich</option>
                            <option value="labaratories">Labs</option>
                            <option value="secretary">Secretar</option>
                            <option value="lfk">LFK</option>
                            
                        </optgroup>
                    <option value="Poliklinika">Poliklinika</option>
                    <option value="Hospital">7-fl building</option>
                </select>
                <input type="text" placeholder="input your task here..." class="todo__input">
                <button class="todo__btn">Add Task</button>
            </div>
            <span class="message"></span>
            <ul class="todo__list">
                <!-- <li class="checked">Task</li>
               <li>Task</li>
               <li>Task</li> -->
            </ul>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>

</html>
